<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{[{id:"auto",label:"Auto"},...SECTIONS.map(s=>({id:s.id,label:s.id}))].map(o=><button key={o.id} onClick={()=>set("section")(o.id)} style={{flex:"1 0 28%",padding:"4px 0",border:"none",borderRadius:6,background:d.section===o.id?"#d4145a":"rgba(255,255,255,.1)",color:"white",fontSize:12,fontWeight:700,cursor:"pointer"}}>{o.label}</button>)}</div>
<div style={{background:"rgba(212,20,90,.2)",borderRadius:10,padding:"9px 11px"}}><div style={{fontSize:10,fontWeight:800,color:"#fbb3cc",textTransform:"uppercase"}}>CARES Focus</div><select aria-label="CARES Focus" value={d.caresFocus} onChange={e=>set("caresFocus")(e.target.value)} style={{width:"100%",background:"transparent",color:"white",border:"none",fontSize:17,fontWeight:800}}>{CARES.map(c=><option key={c} value={c}>{c}</option>)}</select><div style={{fontSize:12,color:"#c5a8e8",fontStyle:"italic"}}>{CARES_ES[d.caresFocus]}</div></div>
<div style={{background:vl.light,borderRadius:10,padding:"9px 11px"}}><div style={{fontSize:10,fontWeight:800,color:vl.color,textTransform:"uppercase"}}>CHAMPS Voice Level</div><div style={{display:"flex",gap:4,margin:"6px 0"}}>{VOICE_LEVELS.map(x=><button key={x.level} onClick={()=>set("voiceLevel")(x.level)} style={{flex:1,padding:"6px 0",border:"none",borderRadius:6,background:d.voiceLevel===x.level?x.color:"rgba(0,0,0,.08)",color:d.voiceLevel===x.level?"white":"#555",fontWeight:800,cursor:"pointer"}}>{x.level}</button>)}</div><div style={{fontSize:19,fontWeight:800,color:vl.color}}>{vl.level} · {vl.label}</div><div style={{fontSize:12,color:vl.color,fontStyle:"italic"}}>{vl.es}</div><div style={{fontSize:12,color:"#444"}}>{vl.desc} <i>{vl.descEs}</i></div></div>
<ClassTimer/>
{d.showSeating&&(d.seatingUrl?<a href={d.seatingUrl} target="_blank" rel="noopener noreferrer" style={{background:"#d4145a",color:"white",borderRadius:10,padding:9,textAlign:"center",fontSize:14,fontWeight:800,textDecoration:"none"}}>Seating Chart <i>/ Mapa de asientos</i></a>:<button onClick={()=>{setTab("Week");setEditOpen(true)}} style={{border:"1.5px dashed rgba(255,255,255,.35)",borderRadius:10,padding:8,color:"#c5a8e8",background:"transparent"}}>Seating chart link goes here. Click to add it.</button>)}
<div className="classroom-scroll" style={{flex:1,overflow:"auto"}}><div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",color:"#c5a8e8"}}>Widgets</div>{OPTIONAL_WIDGETS.map(w=><button key={w.key} onClick={()=>set(w.key)(!d[w.key])} style={{width:"100%",display:"flex",justifyContent:"space-between",padding:"5px 8px",border:"none",borderRadius:8,background:d[w.key]?"rgba(255,255,255,.15)":"transparent",color:d[w.key]?"white":"#c5a8e8",cursor:"pointer",textAlign:"left"}}>{w.label}<span>●</span></button>)}</div>
<button onClick={()=>setEditOpen(x=>!x)} style={{background:"white",color:"#351c75",border:"none",borderRadius:8,padding:8,fontSize:14,fontWeight:800,cursor:"pointer"}}>{editOpen?"Close editor":"Edit today"}</button>
</aside>
<div style={{flex:1,background:"#f0ebfa",display:"flex",gap:6,padding:6,overflow:"hidden"}}><div style={{flex:1,display:"flex",flexDirection:"column",gap:6,minWidth:0}}><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,flex:"1.55 1 0",minHeight:0}}><DoNowCard d={v} timer={timer}/><TargetCard d={v}/></div><div style={{display:"grid",gridTemplateColumns:"1.1fr 1fr 1fr",gap:10,flex:"1 1 0",minHeight:0}}><ActivityMaterialsCard d={v}/><CriteriaCard d={v}/><WordBankCard d={v}/></div><div style={{display:"grid",gridTemplateColumns:"1.1fr 1fr 1fr",gap:10,flex:"1 1 0",minHeight:0}}><AgendaCard d={v} minsIn={minsIn}/><StandardsCard d={v}/><ExitTicketCard d={v}/></div><CalendarCard day={dayN}/></div>{anyOptional&&<aside className="classroom-scroll" style={{width:340,overflow:"auto",display:"flex",flexDirection:"column",gap:10}}>{d.showWriteFirst&&<WriteFirstCard d={v}/>}</aside>}</div></div></div>
{editOpen&&<aside aria-label="Edit today" style={{position:"fixed",top:0,right:0,bottom:0,width:380,background:"white",boxShadow:"-4px 0 32px rgba(0,0,0,.25)",zIndex:9999,display:"flex",flexDirection:"column"}}><div style={{padding:"16px 18px 8px",display:"flex",justifyContent:"space-between"}}><b style={{fontSize:17,color:"#351c75"}}>Edit today</b><button onClick={()=>setEditOpen(false)} style={{background:"#f0eafc",border:"none",borderRadius:8,padding:"5px 12px",fontWeight:800,color:"#351c75"}}>Done</button></div><div style={{display:"flex",gap:4,padding:"0 18px 8px"}}>{EDIT_FIELDS.map(([t])=><button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:"6px 0",border:"none",borderRadius:6,background:tab===t?"#351c75":"#f0eafc",color:tab===t?"white":"#351c75",fontSize:12,fontWeight:800}}>{t}</button>)}</div><div className="classroom-scroll" style={{flex:1,overflow:"auto",padding:"4px 18px 18px"}}>{EDIT_FIELDS.find(([t])=>t===tab)[1].map(({label,k,multi,rows})=><div key={k} style={{marginBottom:10}}><label htmlFor={`field-${k}`} style={labelStyle}>{label}</label>{multi?<textarea id={`field-${k}`} value={v[k]} onChange={e=>set(k)(e.target.value)} rows={rows||2} style={{...inputStyle,resize:"vertical"}}/>:<input id={`field-${k}`} value={v[k]} onChange={e=>set(k)(e.target.value)} style={inputStyle}/>}</div>)}{tab==="Lesson"&&<><div style={{marginBottom:10}}><label htmlFor="work-mode" style={labelStyle}>How students work</label><select id="work-mode" value={v.howToWork} onChange={e=>set("howToWork")(e.target.value)} style={inputStyle}>{Object.entries(WORK_MODES).map(([k,x])=><option key={k} value={k}>{x.label}</option>)}</select></div><div style={{marginBottom:10}}><label htmlFor="timer-minutes" style={labelStyle}>Do Now timer (minutes)</label><input id="timer-minutes" type="number" min="1" max="30" value={v.doNowMins} onChange={e=>{const n=Math.max(1,+e.target.value||1);set("doNowMins")(n);timer.reset(n)}} style={inputStyle}/></div></>}{tab==="Week"&&<button onClick={()=>setD(p=>{const o={...(p.over||{})};delete o[dayN];return{...p,over:o};})} style={{marginTop:8,background:"#ffebee",border:"none",borderRadius:8,padding:"7px 12px",fontSize:12,fontWeight:800,color:"#b71c1c",cursor:"pointer"}}>Clear my edits for this day</button>}</div></aside>}
</>};
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
