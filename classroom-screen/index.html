<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Classroom Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--maroon:#6B173A;--maroon-d:#4F1029;--gold:#D7A629;--gold-l:#FFF2CC;--ink:#20252B;--slate:#5E6670;--stone:#D8D2C8;--cream:#FAF7F0;--red:#C8413B;--green:#3D8B61;--bg:#E9E3D8;--tan:#F3DDB0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:Raleway,"Segoe UI",Arial,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
i{font-style:italic}
#board{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:grid;grid-template-columns:460px 1fr;background:var(--bg);overflow:hidden}

/* Sidebar */
#side{background:var(--maroon);color:#fff;padding:20px 20px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.s-subj{font-size:32px;font-weight:800;line-height:1.1}
.s-who{font-size:20px;color:var(--tan);margin-top:4px}
.s-unitname{font-size:22px;font-weight:800}
.s-eq{font-size:25px;font-weight:700;color:var(--gold);line-height:1.2;margin-top:4px}
.s-eqes{font-size:20px;font-style:italic;color:var(--tan);line-height:1.25}
.s-box{background:rgba(0,0,0,.2);border-radius:16px;padding:12px 16px;width:100%;display:block}
.s-lbl{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.s-lbl i{text-transform:none;letter-spacing:0;font-weight:500;color:var(--tan)}
.s-clock{text-align:center}
.s-time{font-size:62px;font-weight:800;line-height:1.05}
.s-date{font-size:22px;color:var(--tan)}
.s-sec{font-size:21px;font-weight:700;color:var(--gold);margin-top:4px}
.s-now{font-size:21px;font-weight:800;color:#fff;background:rgba(215,166,41,.28);border-radius:10px;padding:4px 8px;margin-top:6px}
.ag-left{font-size:.62em;font-weight:800;color:var(--ink);background:#fff;border-radius:99px;padding:.1em .6em;justify-self:end;white-space:nowrap}
.ag{grid-template-columns:4.4em auto 1fr auto!important}
.qs{display:flex;gap:6px;margin-top:10px}
.qs-b{flex:1;min-width:0;height:60px;border-radius:12px;background:var(--cream);border:3px solid var(--stone);font-size:28px;text-align:center}
.qs-b:active{background:var(--gold)}
#chyron{background:var(--ink);color:#fff;border-radius:16px 16px 0 0;display:flex;align-items:center;overflow:hidden;cursor:pointer;min-width:0}
.ch-l{background:var(--gold);color:var(--ink);font-size:22px;font-weight:800;padding:0 18px;height:100%;display:flex;flex-direction:column;justify-content:center;white-space:nowrap;line-height:1.1}
.ch-l i{font-size:16px;font-weight:500}
.ch-win{flex:1;overflow:hidden;min-width:0}
.ch-track{display:inline-flex;white-space:nowrap;animation:tick linear infinite}
.ch-i{font-size:26px;font-weight:600;padding:0 48px 0 0}
.ch-i b{color:var(--gold)}.ch-i i{color:var(--tan);font-weight:500}
.ch-x{padding:0 16px;color:var(--tan)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.sb{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:1fr;gap:12px;flex:1;min-height:0}
.sb-b{background:var(--cream);border:4px solid var(--stone);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.sb-b:active{background:var(--gold);border-color:var(--gold)}
.sb-ic{font-size:52px;line-height:1}
.sb-en{font-size:22px;line-height:1.1;font-weight:800;color:var(--maroon)}
.sb-b i{font-size:17px;color:var(--slate)}
.an-row{font-size:30px;font-weight:800;color:var(--maroon);letter-spacing:.08em;line-height:1.2}
.an{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:18px;flex:1;min-height:0}
.an-c{display:flex;align-items:center;gap:26px;background:var(--cream);border-radius:20px;border-left:10px solid var(--gold);padding:10px 26px;min-height:0;overflow:hidden}
.an-s{flex:0 0 120px;text-align:center;font-size:84px;font-weight:800;color:var(--maroon);line-height:1}
.an-l{font-size:34px;font-weight:800;color:var(--maroon)}
.an-l i{font-size:26px;font-weight:500;color:var(--slate)}
.an-m{font-size:32px;font-weight:700;line-height:1.2}
.an-t .es{font-size:26px}
#entry{display:none}
body.entry{overflow:auto;background:var(--bg)}
body.entry #board{display:none}
body.entry #entry{display:block;min-height:100vh}
.e-wrap{box-sizing:border-box;min-height:100vh;padding:clamp(12px,2vw,28px);display:flex;flex-direction:column;gap:clamp(10px,1.6vw,20px)}
.e-h{background:var(--maroon);color:#fff;border-radius:20px;border-bottom:6px solid var(--gold);padding:clamp(12px,2vw,24px) clamp(16px,2.6vw,32px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.e-cls{font-size:clamp(14px,1.8vw,22px);color:var(--tan)}
.e-wel{font-size:clamp(26px,4.2vw,54px);font-weight:800;line-height:1.1}
.e-wel i{display:block;font-size:.55em;font-weight:500;color:var(--tan)}
.e-when{text-align:right;font-size:clamp(14px,1.8vw,22px);color:var(--tan)}
#eTime{font-size:clamp(28px,4.2vw,54px);font-weight:800;color:#fff;line-height:1.1}
.e-grid{flex:1;display:grid;grid-template-columns:1fr;gap:clamp(10px,1.6vw,20px)}
@media (min-aspect-ratio:1/1){.e-grid{grid-template-columns:1.15fr 1fr;grid-template-rows:auto 1fr}.e-rt{grid-row:span 2}}
.e-card{--fs:clamp(18px,2.3vw,32px);background:#fff;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 12px rgba(32,37,43,.08);min-height:0}
.e-ch{background:var(--maroon);color:#fff;border-bottom:5px solid var(--gold);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.e-t{font-size:clamp(20px,2.6vw,34px);font-weight:800}
.e-t i{font-weight:500;font-size:.7em;color:var(--tan)}
.e-x{font-size:clamp(24px,3vw,36px);color:var(--gold);font-weight:800;min-width:44px;text-align:center}
.e-list{padding:clamp(10px,1.4vw,18px);display:flex;flex-direction:column;gap:.45em;font-size:var(--fs);flex:1}
.e-item{display:flex;align-items:center;gap:.6em;background:var(--cream);border-radius:16px;padding:.45em .7em}
.e-ic{font-size:1.7em;line-height:1;flex:0 0 1.9em;text-align:center;white-space:nowrap}
.e-item b{display:block;font-weight:800;line-height:1.2}
.e-item i{display:block;color:var(--slate);font-size:.78em;line-height:1.25}
.e-st iframe{flex:1;border:0;width:100%;min-height:42vh;background:var(--cream)}
.e-card.e-max{position:fixed;inset:0;z-index:50;border-radius:0;--fs:clamp(24px,3.8vw,58px)}
.e-card.e-max .e-list{justify-content:center}
.e-card.e-max iframe{min-height:0}
.e-edit{background:var(--gold);color:var(--ink);border-radius:12px;padding:8px 16px;font-size:clamp(16px,1.8vw,22px);font-weight:800;margin-left:auto}
.e-ch .e-t{flex:1;cursor:pointer}
.pk-back{position:fixed;inset:0;z-index:60;background:rgba(32,37,43,.6);display:flex;align-items:center;justify-content:center;padding:clamp(10px,3vw,40px)}
.pk{background:#fff;border-radius:22px;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.pk-h{background:var(--maroon);color:#fff;border-bottom:5px solid var(--gold);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:clamp(20px,2.6vw,30px);font-weight:800}
.pk-h i{display:block;font-size:.6em;font-weight:500;color:var(--tan)}
.pk-done{background:var(--gold);color:var(--ink);border-radius:12px;padding:10px 22px;font-size:clamp(18px,2vw,24px);font-weight:800}
.pk-list{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.pk-i{display:flex;align-items:center;gap:14px;background:var(--cream);border:3px solid var(--stone);border-radius:14px;padding:10px 14px;font-size:clamp(16px,2vw,24px);text-align:left}
.pk-i.on{border-color:var(--maroon);background:#F6E9EE}
.pk-i b{display:block}.pk-i i{display:block;color:var(--slate);font-size:.8em}
.pk-box{flex:0 0 1.5em;height:1.5em;border:3px solid var(--maroon);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.pk-i.on .pk-box{background:var(--maroon)}
.pk-f{padding:12px 14px;border-top:2px solid var(--stone)}
.pk-f button{background:var(--cream);border:3px solid var(--stone);border-radius:12px;padding:10px 18px;font-size:clamp(15px,1.8vw,20px);font-weight:700}
.seat{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;padding:12px;font-size:clamp(14px,1.6vw,22px)}
.ov-seating .seat{font-size:24px}
.seat-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.seat-secs{display:flex;gap:6px;flex-wrap:wrap}
.seat-secs button,.seat-tabs button{background:var(--cream);border:3px solid var(--stone);border-radius:10px;padding:.3em .7em;font-weight:800;font-size:1em}
.seat-secs button.on,.seat-tabs button.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.seat-tabs{display:flex;gap:10px;font-size:24px}
.seat-tip{font-size:.85em;color:var(--slate);font-style:italic}
.seat-front{background:var(--ink);color:#fff;text-align:center;border-radius:10px;padding:.3em;font-weight:800;font-size:.9em}
.seat-grid{flex:1;display:grid;gap:clamp(8px,1.2vw,18px);min-height:0}
.seat-grid.groups{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.seat-grid.rows{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr)}
.pod{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;background:var(--bg);border-radius:14px;padding:6px}
.desk{background:#fff;border:3px solid var(--stone);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:clamp(46px,7vh,90px);padding:4px;text-align:center}
.desk .dn{font-size:.7em;font-weight:800;color:var(--gold)}
.desk .dname{font-weight:800;color:var(--maroon);font-size:1em;line-height:1.1;word-break:normal;overflow-wrap:normal}
.e-st .desk .dname{font-size:.78em}
.desk.empty .dname::after{content:"—";color:var(--stone)}
.desk.pick{border-color:var(--gold);background:var(--gold-l)}
.e-st .seat{min-height:44vh}
.sh-body{padding:16px 20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;overflow:auto}
.sh-qr{background:#fff;flex:0 0 auto}
.sh-qr svg{width:min(52vh,420px);height:auto;display:block}
.sh-txt{flex:1;min-width:240px;font-size:clamp(16px,1.8vw,22px);line-height:1.4}
.sh-txt ol{margin:.4em 0 .8em;padding-left:1.3em}
.sh-link{width:100%;font:inherit;font-size:.8em;padding:8px 10px;border:3px solid var(--stone);border-radius:10px}
.sh-copy{margin-top:10px;background:var(--maroon);color:#fff;border-radius:12px;padding:10px 18px;font-weight:800}
.h-bell{background:#fff;color:var(--maroon)}
.h-bell.on{background:var(--gold-l)}
.bl-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bl-cur{font-size:26px;color:var(--slate);flex:1}
.bl-alt{background:var(--cream);color:var(--maroon);border:3px solid var(--stone)}
.bl{flex:1;min-height:0;overflow:auto;columns:2;column-gap:28px}
.bl-cat{break-inside:avoid;margin-bottom:18px}
.bl-ch{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-bottom:8px}
.bl-i{display:block;width:100%;background:var(--cream);border:3px solid var(--stone);border-radius:14px;padding:12px 16px;margin-bottom:10px;text-align:left}
.bl-i:active{border-color:var(--maroon)}
.bl-i b{display:block;font-size:26px;line-height:1.25}
.bl-i i{display:block;font-size:21px;color:var(--slate);margin-top:4px}
.rv{flex:1;overflow:hidden;min-height:0}
.rv-track{list-style:none;margin:0;padding:0;animation:roll linear infinite}
.rv-track li{font-size:52px;line-height:1.25;padding:18px 0;border-bottom:2px solid var(--stone)}
.rv-track li b{color:var(--maroon)}
.rv-track .es{font-size:38px}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@media (prefers-reduced-motion:reduce){.ch-track,.rv-track{animation-duration:0s!important}}
.s-cares{text-align:left}
.s-cv{font-size:30px;font-weight:800;line-height:1.15}
.s-ces{font-size:20px;font-style:italic;color:var(--tan)}
.v-btns{display:flex;gap:8px;margin:8px 0}
.v-b{flex:1;height:54px;border-radius:10px;background:rgba(255,255,255,.14);font-size:28px;font-weight:800;text-align:center}
.v-b.on.v0{background:#fff;color:var(--ink)}
.v-b.on.v1{background:#8FB3D9;color:var(--ink)}
.v-b.on.v2{background:var(--green)}
.v-b.on.v3{background:var(--gold);color:var(--ink)}
.v-b.on.v4{background:var(--red)}
.v-name{font-size:29px;font-weight:800;line-height:1.15}
.v-name i{font-size:21px;font-weight:500;color:var(--tan)}
.v-desc{font-size:18px;line-height:1.3;color:#fff;opacity:.9;margin-top:2px}
.s-row{display:flex;gap:8px}.s-row .s-gear{flex:1}
.s-gear{font-size:18px;font-weight:700;color:var(--tan);text-align:center;padding:8px;border-radius:10px;background:rgba(255,255,255,.08)}

/* Timer */
.timer{background:rgba(0,0,0,.28);border-radius:16px;padding:12px 16px;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.t-top{display:flex;justify-content:space-between;align-items:center}
.t-expand{font-size:26px;color:var(--tan);line-height:1}
.t-display{font-size:124px;font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums;color:#fff;width:100%}
.t-display.low{color:var(--gold)}
.timer.done .t-display{animation:pulse 1s ease-in-out infinite;color:var(--gold)}
.t-msg{font-size:20px;font-weight:800;text-align:center;color:var(--gold);min-height:0}
.t-msg:empty{display:none}
.t-bar{height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.t-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .25s linear}
.t-presets,.t-ctrl{display:flex;gap:6px}
.t-presets button{flex:1;height:46px;border-radius:10px;background:rgba(255,255,255,.14);font-size:22px;font-weight:800;text-align:center}
.t-presets button.on{background:var(--gold);color:var(--ink)}
.t-ctrl button{flex:1;height:54px;border-radius:10px;background:rgba(255,255,255,.14);font-size:22px;font-weight:800;text-align:center}
.t-ctrl button:first-child,.t-ctrl button:last-child{flex:0 0 54px;font-size:30px}
.t-ctrl .t-go{background:#fff;color:var(--maroon);flex:1.4}
@keyframes pulse{50%{opacity:.35}}

/* Main */
#main{padding:14px 16px 0;display:grid;grid-template-rows:1fr 62px;gap:12px;min-height:0;min-width:0}
#mainBody{display:grid;grid-template-rows:1fr 168px 100px;gap:12px;min-height:0;min-width:0}
.top{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.card{background:#fff;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;min-height:0;box-shadow:0 3px 12px rgba(32,37,43,.08);cursor:pointer}
.c-donow{flex:1.35}.c-agenda{flex:1}
.c-target{flex:.8}.c-clo{flex:1.15}.c-std{flex:.95}
.card-h{background:var(--maroon);color:#fff;padding:9px 18px;display:flex;align-items:center;gap:14px;border-bottom:5px solid var(--gold);flex-shrink:0}
.c-agenda .card-h,.c-std .card-h{background:var(--ink)}
.h-t{font-size:30px;font-weight:800;white-space:nowrap}
.h-es{font-size:22px;font-style:italic;color:var(--tan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-sp{flex:1}
.h-x{font-size:24px;color:var(--tan);opacity:.8}
.h-btn{background:var(--gold);color:var(--ink);border-radius:10px;padding:6px 16px;font-size:22px;font-weight:800;white-space:nowrap}
.card-b{padding:12px 20px;flex:1;min-height:0;overflow:hidden;line-height:1.25}
.en{font-weight:700}
.es{font-style:italic;color:var(--slate);font-size:.8em;margin-top:.3em;line-height:1.3}
.pill{display:inline-block;background:var(--gold-l);color:var(--ink);border-radius:10px;padding:.2em .6em;font-size:.6em;font-weight:800;margin-bottom:.5em}
.pill i{font-weight:500;color:var(--slate)}
.ph{color:#9A9FA6;font-style:italic;font-weight:500}
.c-target .en{color:var(--maroon);font-weight:800}
.ag{display:grid;grid-template-columns:4.4em auto 1fr;column-gap:.6em;align-items:baseline;padding:.18em .4em;border-radius:10px}
.ag-t{font-size:.62em;font-weight:800;color:var(--slate)}
.ag-en{font-weight:700}
.ag-es{font-size:.75em;font-style:italic;color:var(--slate)}
.ag.now{background:var(--gold)}
.ag.now .ag-t,.ag.now .ag-es{color:var(--ink)}
.std{display:flex;gap:.5em;align-items:flex-start;margin-bottom:.45em}
.std-c{background:var(--maroon);color:#fff;border-radius:99px;padding:.1em .55em;font-weight:800;white-space:nowrap;font-size:.9em}
.std-t{line-height:1.3}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;min-height:0}
.tile{background:#fff;border-radius:18px;border-top:8px solid var(--gold);padding:12px 16px;display:flex;flex-direction:column;min-width:0;overflow:hidden;box-shadow:0 3px 12px rgba(32,37,43,.08)}
.tile-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile-t{font-size:21px;font-weight:800;color:var(--maroon);line-height:1.1}
.tile-es{font-size:18px;font-style:italic;color:var(--slate)}
.tile-p{font-size:17px;line-height:1.3;margin-top:6px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .h-x{color:var(--slate)}

/* Week */
.week{display:grid;grid-template-columns:150px repeat(5,1fr);gap:12px;min-height:0}
.wk-l{display:flex;flex-direction:column;justify-content:center;gap:6px}
.wk-home{font-size:22px;font-weight:800;color:var(--maroon);text-align:left;line-height:1.1}
.wk-home i{display:block;font-size:16px;font-weight:500;color:var(--slate)}
.wk-nav{display:flex;gap:6px}
.wk-nav button{flex:1;height:36px;border-radius:10px;background:#fff;font-size:26px;font-weight:800;color:var(--maroon);text-align:center;line-height:1}
.wk{background:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:center;min-width:0;border:3px solid transparent}
.wk.tod .wk-d span{background:var(--gold);color:var(--ink);border-radius:6px;padding:0 5px}
.wk.sel{background:var(--maroon);color:#fff;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.wk.sel.tod .wk-d span{color:var(--ink)}
.wk-d{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:52px}
.wk-d span{font-size:15px;font-weight:800;text-transform:uppercase;color:var(--slate)}
.wk-d b{font-size:34px;line-height:1;color:var(--maroon)}
.wk.sel .wk-d span{color:var(--tan)}.wk.sel .wk-d b{color:var(--gold)}
.wk-x{font-size:18px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.wk-n{font-weight:800;color:var(--maroon)}
.wk.sel .wk-n{color:var(--gold)}
.wk-no{font-weight:700;color:var(--slate)}

/* Overlay */
#overlay{position:absolute;inset:0;pointer-events:none;z-index:10}

.ov-back{position:absolute;inset:0;background:rgba(32,37,43,.6);padding:32px 40px}
.ov-panel{background:#fff;border-radius:24px;height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);cursor:default}

.ov-t{font-size:50px;font-weight:800}
.ov-es{font-size:34px;font-style:italic;color:var(--tan)}
.ov-x{width:80px;height:80px;border-radius:16px;background:var(--gold);color:var(--ink);font-size:44px;font-weight:800;text-align:center;flex-shrink:0}
.ov-link{background:#fff;color:var(--maroon);border-radius:12px;padding:12px 22px;font-size:26px;font-weight:800;text-decoration:none;white-space:nowrap}
.ov-b{flex:1;min-height:0;padding:28px 40px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.ov-b>.fit{flex:1;min-height:0;overflow:hidden;line-height:1.25}
.ov-timer .ov-b{background:var(--maroon);color:#fff;align-items:center;justify-content:center}
.ov-timer .timer{background:none;width:1100px;flex:0 0 auto;gap:22px}
.ov-timer .t-display{font-size:320px}

.ov-timer .s-lbl{font-size:26px}
.lbl{font-size:.45em;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);margin-top:1em}
.chips{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.3em}
.chip{background:var(--gold-l);border-radius:99px;padding:.15em .6em;font-size:.55em;font-weight:700}
.note{font-size:.42em;color:var(--slate);margin-top:.8em}
.crit{border-radius:16px;padding:.35em .6em;margin-bottom:.35em}
.crit b{display:block;font-size:.8em}
.crit .es{font-size:.72em}
.crit.met{background:#E3F0E8}.crit.met b{color:var(--green)}
.crit.app{background:var(--gold-l)}.crit.app b{color:#8A6508}
.crit.not{background:#F7E1DF}.crit.not b{color:var(--red)}
.submit{background:var(--maroon);color:#fff;border-radius:14px;padding:16px;text-align:center;font-size:30px;font-weight:800;flex-shrink:0}

.vb{display:grid;grid-template-columns:1fr 1.15fr;gap:32px;flex:1;min-height:0}

.vw{background:var(--cream);border:3px solid var(--stone);border-radius:18px;padding:12px 24px;display:flex;flex-direction:column}
.vw span{font-size:54px;font-weight:800;color:var(--maroon);text-decoration:underline dotted 3px}

.vw.on{background:var(--maroon);border-color:var(--maroon)}
.vw.on span{color:#fff}.vw.on i{color:var(--tan)}
.vb-def{background:var(--cream);border-radius:22px;border-top:10px solid var(--gold);padding:28px 36px;overflow:hidden}
.vd-w{font-size:72px;font-weight:800;color:var(--maroon);line-height:1.05}
.vd-say{font-size:32px;color:var(--slate);margin-top:6px}
.vd-say b{color:var(--ink);letter-spacing:.04em}
.vd-d{font-size:42px;font-weight:700;margin-top:22px;line-height:1.25}
.vd-de{font-size:32px;font-style:italic;color:var(--slate);margin-top:6px}
.vd-ex{font-size:30px;background:#fff;border-radius:14px;padding:16px 20px;margin-top:22px;line-height:1.35}
.vd-ex b{color:var(--maroon)}
.vd-empty{font-size:36px;color:var(--slate);line-height:1.4}
.gram-ans{background:var(--gold-l);border-radius:16px;padding:.4em .6em;margin-top:.6em}
.btn{background:var(--maroon);color:#fff;border-radius:14px;padding:14px 26px;font-size:28px;font-weight:800;align-self:flex-start}
.seat-frame{flex:1;border:0;border-radius:14px;background:var(--cream);width:100%}

/* Settings */
.set{display:flex;flex-direction:column;gap:22px;overflow:auto}
.set-row{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.set-l{font-size:28px;font-weight:800;color:var(--maroon);padding-top:10px}
.set-c{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.set-c.colm{flex-direction:column;align-items:stretch}
.set-c button{background:var(--cream);border:3px solid var(--stone);border-radius:12px;padding:10px 20px;font-size:24px;font-weight:700}
.set-c button.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.set-v{font-size:26px;font-weight:700;padding:0 8px}
.set-c input{font:inherit;font-size:22px;padding:12px 16px;border:3px solid var(--stone);border-radius:12px;width:100%}
.set-note{font-size:20px;color:var(--slate)}
.set-help{font-size:20px;color:var(--slate);line-height:1.4}
